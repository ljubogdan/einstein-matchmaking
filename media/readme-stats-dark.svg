<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="214" viewBox="0 0 1280 214" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Inter, Arial, 'Liberation Sans', sans-serif">
<title id="title">Prenup in four numbers</title><desc id="desc">3.9 times faster with the agents in parallel (173.9 s vs 680.6 s, on the earlier 4-challenge demo). 20 of 20 planted false claims stopped. 0 double-booked researchers against 104 with last-writer-wins on all 489 challenges. 4 of 15 challenges in a seeded sample got a reasoned no; the other 11 got proposals.</desc>
<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2997FF"/><stop offset=".55" stop-color="#9D8CFF"/><stop offset="1" stop-color="#DA8FFF"/></linearGradient></defs>
<style>.up{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes up{from{opacity:0;transform:translateY(12px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g class="up" style="animation-delay:0.00s"><rect x="0.5" y=".5" width="304" height="213" rx="22" fill="#1C1C1E" stroke="#38383A"/><text x="28" y="84" font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#brand)">3.9<tspan font-size="30" letter-spacing="-0.5">×</tspan></text><text x="28" y="124" font-size="16" font-weight="600" fill="#F5F5F7">faster in parallel</text><text x="28" y="152" font-size="14" font-weight="400" fill="#A1A1A6">173.9 s vs 680.6 s, the earlier</text><text x="28" y="173" font-size="14" font-weight="400" fill="#A1A1A6">4-challenge demo, live twice</text></g><g class="up" style="animation-delay:0.12s"><rect x="325.5" y=".5" width="304" height="213" rx="22" fill="#1C1C1E" stroke="#38383A"/><text x="353" y="84" font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#brand)">20/20<tspan font-size="30" letter-spacing="-0.5"></tspan></text><text x="353" y="124" font-size="16" font-weight="600" fill="#F5F5F7">planted false claims stopped</text><text x="353" y="152" font-size="14" font-weight="400" fill="#A1A1A6">16 by the code checks, 4 by</text><text x="353" y="173" font-size="14" font-weight="400" fill="#A1A1A6">the support check</text></g><g class="up" style="animation-delay:0.24s"><rect x="650.5" y=".5" width="304" height="213" rx="22" fill="#1C1C1E" stroke="#38383A"/><text x="678" y="84" font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#brand)">0<tspan font-size="30" letter-spacing="-0.5"> vs 104</tspan></text><text x="678" y="124" font-size="16" font-weight="600" fill="#F5F5F7">double-booked researchers</text><text x="678" y="152" font-size="14" font-weight="400" fill="#A1A1A6">Arbiter vs last-writer-wins,</text><text x="678" y="173" font-size="14" font-weight="400" fill="#A1A1A6">on all 489 challenges</text></g><g class="up" style="animation-delay:0.36s"><rect x="975.5" y=".5" width="304" height="213" rx="22" fill="#1C1C1E" stroke="#38383A"/><text x="1003" y="84" font-size="54" font-weight="700" letter-spacing="-1.5" fill="url(#brand)">4<tspan font-size="30" letter-spacing="-0.5"> of 15</tspan></text><text x="1003" y="124" font-size="16" font-weight="600" fill="#F5F5F7">challenges got a reasoned no</text><text x="1003" y="152" font-size="14" font-weight="400" fill="#A1A1A6">in a seeded sample; the</text><text x="1003" y="173" font-size="14" font-weight="400" fill="#A1A1A6">other 11 got proposals</text></g>
</svg>
