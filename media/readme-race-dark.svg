<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="548" viewBox="0 0 1280 548" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Inter, Arial, 'Liberation Sans', sans-serif">
<title id="title">The race for R1008 in the demo run</title><desc id="desc">matchmaker-1 reserves researcher R1008 for C001-CH1 at board version 0; matchmaker-2's write for C032-CH1 also saw version 0 and is refused. The Arbiter keeps R1008 on C001-CH1: R1015 is a partial-fit alternative for both, and C001-CH1 loses more search relevance by taking it (11% against 5%). Its reasoning was checked before it was published: 2 of 3 citations backed. matchmaker-2 re-matches C032-CH1 to R1015.</desc>
