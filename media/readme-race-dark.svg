<text x="454" y="260" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">saw v0</text>
<text x="826" y="200" font-size="12" font-weight="400" fill="#8E8E93" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" class="fin" style="animation:k2 16s linear infinite">conflict</text>
