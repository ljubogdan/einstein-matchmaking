<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenup board</title>
<link rel="icon" type="image/svg+xml" href="/media/prenup-mark.svg">
<style>
  @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/media/inter-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/media/inter-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/media/inter-cyrillic-wght-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  /* San Francisco where it exists (macOS), bundled Inter elsewhere. One accent; red only for the Critic. Light and dark. */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --logo: #000000; --muted: #6e6e73; --faint: #86868b; --line: rgba(0, 0, 0, .08);
    --fill: #f2f2f5; --bubble: #e9e9eb; --accent: #0071e3; --accent-2: #5ac8fa; --accent-soft: rgba(0, 113, 227, .09);
    --red: #d70015; --red-soft: rgba(255, 59, 48, .08); --header: rgba(250, 250, 252, .72);
    --shadow: 0 1px 1px rgba(0, 0, 0, .02), 0 2px 10px rgba(0, 0, 0, .05);
    --lift: 0 2px 4px rgba(0, 0, 0, .04), 0 12px 32px rgba(0, 0, 0, .08);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
    --strip: 236px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --logo: #ffffff; --muted: #a1a1a6; --faint: #737378; --line: rgba(255, 255, 255, .09);
    --fill: #2c2c2e; --bubble: #2c2c2e; --accent: #0a84ff; --accent-2: #64d2ff; --accent-soft: rgba(10, 132, 255, .18);
    --red: #ff453a; --red-soft: rgba(255, 69, 58, .14); --header: rgba(18, 18, 20, .72);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .05), 0 6px 20px rgba(0, 0, 0, .35);
    --lift: 0 0 0 1px rgba(255, 255, 255, .08), 0 16px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-rows: auto 1fr var(--strip); background: var(--bg);
    color: var(--ink); font: 14px/1.47 var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a.id { font: 500 12px/1 var(--mono); letter-spacing: 0; white-space: nowrap; }
  button { font: inherit; letter-spacing: inherit; cursor: pointer; color: inherit; }
  .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -2.5px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 1.6px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 24px; padding: 14px 28px;
    background: var(--header); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line);
  }
  /* The logo (media/prenup-logo.svg, white) used as a mask, so it is one colour: black in light, white in dark. */
  .logo { display: block; margin: 2px 0 6px; width: 164px; height: 27px; background: var(--logo);
    -webkit-mask: url(/media/prenup-logo.svg) left center / contain no-repeat; mask: url(/media/prenup-logo.svg) left center / contain no-repeat; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .stats { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(88px, 1fr); margin-left: auto; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 1px 14px; text-align: center; }
  .stat + .stat { box-shadow: inset 1px 0 0 var(--line); }
  .stat b { font: 600 24px/1 var(--display); letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--faint); font-size: 11px; line-height: 1.2; font-weight: 500; white-space: nowrap; }
  .stat.live b { color: var(--accent); }
  .stat.crit b { color: var(--red); }
  .controls { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(118, 118, 128, .14); }
  .icon-btn .ic { width: 16px; height: 16px; }
  .primary, .secondary { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 980px; padding: 8px 18px; font-weight: 500; transition: transform .15s, box-shadow .2s, background .2s, opacity .2s; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { filter: brightness(1.08); }
  .secondary { background: var(--accent-soft); color: var(--accent); }
  .secondary:hover { background: rgba(0, 113, 227, .16); }
  .primary:disabled, .secondary:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
  .primary .ic { width: 12px; height: 12px; }

  /* Columns */
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px; padding: 22px 28px 12px; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  section > h2, .head h2 { margin: 0 0 2px 4px; font: 600 19px/1.2 var(--display); letter-spacing: -0.022em; }
  section > .sub { margin: 0 0 12px 4px; color: var(--muted); font-size: 12.5px; }
  .scroll { overflow-y: auto; min-height: 0; padding: 2px 6px 14px; margin: 0 -6px; scrollbar-width: thin; }
  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 12px; transition: box-shadow .25s, transform .25s; }
  .card:hover { box-shadow: var(--lift); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .why { color: var(--muted); }
  .muted { color: var(--muted); }

  main.with-log { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .9fr); }
  section[hidden] { display: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 980px; background: var(--fill); color: var(--muted); white-space: nowrap; }
  .pill .ic { width: 12px; height: 12px; stroke-width: 2.2; }
  .pill .spin { width: 8px; height: 8px; border-width: 1.5px; }
  .pill.soft { background: var(--accent-soft); color: var(--accent); }
  .pill.solid { background: var(--accent); color: #fff; }
  .pill.dark { background: var(--ink); color: var(--bg); }
  .pill.crit { background: var(--red); color: #fff; }
  .pill.gone { text-decoration: line-through; }

  /* A challenge, as a story */
  .co { font: 600 15.5px/1.25 var(--display); letter-spacing: -0.015em; }
  .meta { margin-top: 2px; color: var(--faint); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .ask { margin: 8px 0 0; color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .steps { list-style: none; margin: 12px 0 0; padding: 0; }
  .steps li { position: relative; padding: 0 0 10px 18px; font-size: 13px; }
  .steps li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); opacity: .45; }
  .steps li::after { content: ""; position: absolute; left: 5.5px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
  .steps li:last-child { padding-bottom: 0; }
  .steps li:last-child::after { display: none; }
  .steps li.key::before { background: var(--accent); opacity: 1; }
  .steps li.co-li::before { top: 16px; background: var(--ink); opacity: .8; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip { font: 500 11.5px/1.7 var(--mono); letter-spacing: 0; padding: 0 7px; border-radius: 6px; background: var(--fill); color: var(--faint); white-space: nowrap; flex: none; }
  .chip.ready { color: var(--ink); }
  .chip.picked { background: var(--accent-soft); color: var(--accent); }
  .chip.out { text-decoration: line-through; }
  .callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--fill); }
  .callout > .ic { width: 17px; height: 17px; margin-top: 1px; }
  .callout b { display: block; font-weight: 600; }
  .callout.dark { background: var(--ink); color: var(--bg); }
  .callout.dark a.id { color: var(--accent-2); }
  .callout.dark .why { color: inherit; opacity: .72; }
  :root[data-theme="dark"] .callout.dark a.id { color: #0071e3; }
  .callout.arb { background: var(--accent-soft); }
  .callout.arb > .ic { color: var(--accent); }
  .reason { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .reason.open { display: block; }
  .arb-check { display: flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .arb-check .ic { width: 13px; height: 13px; }
  .more { border: 0; background: none; padding: 0; margin-top: 4px; color: var(--accent); font-size: 12.5px; font-weight: 500; }
  .cta { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 980px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12.5px; }
  .cta:hover { text-decoration: none; background: rgba(0, 113, 227, .16); }

  /* The negotiation, as a conversation */
  .tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 12px; }
  .tabs button { border: 0; border-radius: 980px; padding: 5px 12px; background: var(--surface); box-shadow: var(--shadow); font: 500 12px/1.4 var(--mono); letter-spacing: 0; }
  .tabs button.on { background: var(--ink); color: var(--bg); }
  .tabs button.gone { text-decoration: line-through; color: var(--faint); }
  .follow { margin: 0 4px 0 0; font-size: 12px; color: var(--faint); white-space: nowrap; }
  .follow button { border: 0; box-shadow: none; background: transparent; color: var(--accent); font-family: var(--sans); padding: 0; }
  .parties { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .party { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .party.right { flex-direction: row-reverse; text-align: right; }
  .avatar { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--fill); color: var(--muted); flex: none; }
  .avatar.uni { background: var(--accent); color: #fff; }
  .avatar .ic { width: 19px; height: 19px; }
  .party .txt { min-width: 0; }
  .party b { display: block; font: 600 14px/1.25 var(--display); letter-spacing: -0.01em; }
  .party .txt span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--faint); font-size: 12px; line-height: 1.35; overflow: hidden; }
  .vs { color: var(--faint); }
  .chat { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
  .msg { max-width: 86%; display: flex; flex-direction: column; }
  .msg.company { align-self: flex-start; }
  .msg.researcher { align-self: flex-end; align-items: flex-end; }
  .msg .who { font-size: 11.5px; color: var(--faint); margin: 0 14px 3px; } /* lines up with the text inside the bubble */
  .bubble { padding: 9px 14px; border-radius: 18px; font-size: 13px; line-height: 1.42; background: var(--bubble); color: var(--ink); overflow-wrap: anywhere; }
  .bubble a.id { font-size: .92em; line-height: inherit; vertical-align: baseline; } /* on the text's baseline, same line pitch */
  .msg.company .bubble { border-bottom-left-radius: 6px; }
  .msg.researcher .bubble { border-bottom-right-radius: 6px; background: var(--accent); color: #fff; }
  .msg.researcher .bubble a { color: #fff; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .5); }
  .bubble .changes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .bubble .changes span { white-space: nowrap; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 980px; background: rgba(0, 113, 227, .12); color: var(--accent); }
  .msg.researcher .bubble .changes span { background: rgba(255, 255, 255, .22); color: #fff; }
  .typing .bubble { display: inline-flex; gap: 4px; padding: 12px 14px; }
  .typing .bubble i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; animation: blink 1.2s infinite; }
  @keyframes blink { 30% { opacity: .95; } 60% { opacity: .35; } }
  .system { align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px; }
  .system.ok { color: var(--accent); }
  .group { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
  .group.agreed { box-shadow: var(--shadow), inset 0 3px 0 var(--accent); }
  .row { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 13px; }
  .row:first-child { border-top: 0; }
  .row > span:first-child { color: var(--muted); }
  .row.changed { background: var(--accent-soft); }
  .row.changed > span:first-child { color: var(--accent); font-weight: 600; }
  .row .edit { float: right; margin-left: 8px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 500; }
  .row.edited { background: var(--accent-soft); }
  .row .was { display: block; margin-top: 2px; color: var(--faint); font-size: 12px; }
  .editor { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .editor select, .editor input { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
  .editor input { flex: 1; min-width: 180px; }
  .editor button { border: 0; border-radius: 980px; padding: 5px 12px; font-size: 12.5px; font-weight: 500; }
  .editor .save { background: var(--accent); color: #fff; }
  .editor .cancel { background: var(--fill); }
  .edit-error { flex-basis: 100%; color: var(--red); font-size: 12.5px; }
  .label { display: flex; align-items: center; gap: 6px; margin: 18px 4px 8px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .label .ic { width: 14px; height: 14px; }
  .stop { background: var(--red-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
  .stop .what { display: inline-flex; align-items: center; gap: 5px; color: var(--red); font-weight: 600; }
  .stop .what .ic { width: 14px; height: 14px; }
  .stop .then { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 12.5px; }
  .stop .then .ic { width: 13px; height: 13px; stroke-width: 2.2; }
  .stop .then.fixed { color: var(--accent); font-weight: 600; }
  .stop .then.dropped, .stop .then.wait { color: var(--muted); }
  .gate { margin: 0 0 14px; }
  .gate .pill .ic { width: 12px; height: 12px; }
  .gate .gate-note { margin: 6px 0 0; }
  .linkish { border: 0; padding: 0 4px; background: none; color: var(--accent); font-size: 12.5px; cursor: pointer; }
  .open-cta { margin: 14px 0 6px; }
  .open-cta .cta { padding: 9px 16px; font-size: 13.5px; background: var(--accent); color: #fff; }
  .hero { text-align: center; padding: 48px 24px; color: var(--muted); }
  .hero .ic { width: 40px; height: 40px; stroke-width: 1.4; color: var(--accent); margin-bottom: 8px; }
  .hero h3 { margin: 0 0 6px; font: 600 20px/1.2 var(--display); letter-spacing: -0.02em; color: var(--ink); }
  .hero p { margin: 0 auto; max-width: 380px; font-size: 13.5px; }

  /* Event log */
  .log { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 0; }
  .log > div { display: grid; grid-template-columns: 8px auto 1fr; gap: 0 8px; align-items: baseline; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .log > div:first-child { border-top: 0; }
  .log .g { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); opacity: .5; align-self: center; }
  .log .g.acc { background: var(--accent); opacity: 1; }
  .log .g.ink { background: var(--ink); opacity: .85; }
  .log .g.crit { background: var(--red); opacity: 1; }
  .log .t { font: 500 11px/1 var(--mono); letter-spacing: 0; color: var(--faint); font-variant-numeric: tabular-nums; }
  .log .p { color: var(--faint); margin-right: 5px; }
  .log .crit-text { color: var(--red); }
  .log .run { color: var(--muted); font-style: italic; }

  /* Planted claims */
  .fault { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 8px; font-size: 13px; }
  .fault .claim { font-weight: 500; }
  .fault .src { margin-top: 4px; color: var(--faint); font-size: 12px; }
  .fault .stop { margin: 8px 0 0; padding: 7px 10px; }
  .fault .checking { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--faint); font-size: 12.5px; }
  .big { font: 700 44px/1 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .big small { font-size: 20px; color: var(--faint); font-weight: 600; letter-spacing: -0.02em; }
  .kinds .row { grid-template-columns: 1fr auto; }
  .kinds .row b { font-variant-numeric: tabular-nums; }
  .kinds .row b.crit { color: var(--red); }

  /* Timeline */
  #strip { padding: 0 28px 20px; min-height: 0; }
  #strip .card { height: 100%; margin: 0; display: flex; flex-direction: column; padding: 12px 18px; }
  #strip .card:hover { box-shadow: var(--shadow); }
  #strip .top { align-items: center; }
  #strip .top h2 { margin: 0; font: 600 15px/1.2 var(--display); letter-spacing: -0.015em; }
  #strip .top span { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  #strip svg { width: 100%; flex: 1; min-height: 0; margin-top: 6px; }
  .tl-band { fill: var(--fill); }
  .tl-grid { stroke: var(--line); }
  .tl-sec { fill: var(--faint); font-size: 10px; }
  .tl-name { fill: var(--ink); font-size: 12px; font-weight: 500; }
  .tl-count { fill: var(--faint); font-weight: 400; }
  .tl-open { animation: glow 1.1s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .45; } }
  .tl-tick { stroke: var(--faint); }
  .tl-crit { stroke: var(--red); opacity: .7; }

  .empty { color: var(--faint); font-size: 13px; padding: 24px 4px; }
  [data-enter] { animation: enter .4s ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(5px) scale(.99); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { [data-enter], .spin, .tl-open, .typing .bubble i { animation: none; } }
  @media (max-width: 1500px) { header { gap: 18px; } .stats { grid-auto-columns: minmax(78px, 1fr); } .stat { padding: 1px 8px; } .stat b { font-size: 21px; } }
  /* Small laptops: the status line gives way before the buttons, and the timeline before the columns. */
  @media (max-width: 1420px) {
    header { gap: 12px; padding: 12px 16px; }
    .brand { flex: 1 1 164px; min-width: 164px; }
    .stats, .controls { flex: none; }
    .stats { margin-left: 0; grid-auto-columns: minmax(70px, 1fr); }
    .stat { padding: 1px 4px; }
    .controls { gap: 6px; }
    .controls .primary svg, .controls .secondary svg { display: none; }
  }
  @media (max-width: 1270px) { header { flex-wrap: wrap; row-gap: 10px; } .controls { margin-left: auto; } }
  @media (max-height: 800px) { :root { --strip: 180px; } }
  @media (max-width: 1100px) {
    body { display: block; }
    header { flex-wrap: wrap; gap: 14px; padding: 12px 16px; }
    .stats { margin-left: 0; }
    main { grid-template-columns: 1fr; padding: 16px; }
    .scroll { overflow: visible; }
    #strip { padding: 0 16px 16px; height: 260px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1 class="logo" role="img" aria-label="Prenup"></h1>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <button class="icon-btn" id="logbtn" title="Show or hide the event log"></button>
    <button class="icon-btn" id="theme" title="Light or dark"></button>
    <button class="secondary" id="plant" title="20 false claims built from real records, checked by the Critic"></button>
    <button class="primary" id="run"></button>
  </div>
</header>
<main>
  <section><h2 id="h-left">Matchmakers and Arbiter</h2><div class="scroll" id="challenges"></div></section>
  <section><div class="head"><h2 id="h-mid">Negotiation and Critic</h2><span class="follow" id="follow"></span></div><div class="scroll" id="pair"></div></section>
  <section id="logcol" hidden><h2>Event log</h2><div class="scroll"><div class="log" id="log"></div></div></section>
</main>
<div id="strip"><div class="card"><div class="top"><h2>Timeline</h2></div><svg id="timeline"></svg></div></div>

<script>
const ENGAGEMENT = { joint_project: "Joint project", industrial_phd: "Industrial PhD", contract_research: "Contract research", consulting: "Consulting", internship: "Internship" }
const IP = {
  uni_owns_nonexclusive_licence: "University owns; company gets a non-exclusive licence",
  uni_owns_option_to_licence: "University owns; company has an option to license",
  uni_owns_option_to_assign: "University owns; company has an option to take the results over",
  company_owns_uni_academic_use: "Company owns; university keeps research and teaching use",
  split_by_field: "Split by field of use",
  contract_research_company_owns: "Contract research: company owns",
}
const FIELD = { engagement: "format", ip: "IP", backgroundIp: "background IP", publication: "publication", exclusivity: "exclusivity", contributions: "contributions", money: "money", timeline: "timeline", scope: "scope", contact: "contacts" }
const ACTION = { propose: "proposes", accept: "accepts", walk_away: "walks away" }
const GROUPS = ["Matchmakers", "Analysts", "Profilers", "Critic", "Arbiter", "Negotiators", "Writers"]
const ID = /\b(SYN-(?:PUB|PRJ|PAT)-\d+|C\d{3}-CH\d+|C\d{3}|R\d{4})\b/g

// SF Symbols-like line icons (24 px grid, stroke = currentColor).
const ICONS = {
  check: '<path d="M20 6 9 17l-5-5" />',
  x: '<path d="M18 6 6 18" /><path d="m6 6 12 12" />',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" />',
  rematch: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" />',
  scale: '<path d="M12 3v18" /><path d="m19 8 3 8a5 5 0 0 1-6 0zV7" /><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1" /><path d="m5 8 3 8a5 5 0 0 1-6 0zV7" /><path d="M7 21h10" />',
  building: '<path d="M10 12h4" /><path d="M10 8h4" /><path d="M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />',
  cap: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" />',
  doc: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" />',
  arrows: '<path d="M8 3 4 7l4 4" /><path d="M4 7h16" /><path d="m16 21 4-4-4-4" /><path d="M20 17H4" />',
  moon: '<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />',
  sun: '<circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />',
  play: '<path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />',
  flask: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" /><path d="M6.453 15h11.094" /><path d="M8.5 2h7" />',
  log: '<path d="M3 5h.01" /><path d="M3 12h.01" /><path d="M3 19h.01" /><path d="M8 5h13" /><path d="M8 12h13" /><path d="M8 19h13" />',
}
const icon = (name, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
// Pair ids (C001-CH1__R1015) read as "C001-CH1 × R1015", so both halves link.
const linked = (s) => esc(s).replaceAll("__", " × ").replace(ID, (id) => `<a class="id" href="/record/${id}" target="_blank">${id}</a>`)
const idLink = (id) => `<a class="id" href="/record/${esc(id)}" target="_blank">${esc(id)}</a>`
const pairLabel = (pairId) => pairId.split("__").map(idLink).join(" × ")
const shortClaim = (claimId) => claimId.split("/").slice(1).join("/")
const $ = (id) => document.getElementById(id)

function group(producer) {
  if (/^matchmaker/.test(producer)) return "Matchmakers"
  if (/^analyst/.test(producer)) return "Analysts"
  if (/^profiler/.test(producer)) return "Profilers"
  if (/^critic/.test(producer)) return "Critic"
  if (/^arbiter/.test(producer)) return "Arbiter"
  if (/negotiator(-check)?$/.test(producer)) return "Negotiators"
  if (producer === "writer") return "Writers"
  return null
}

// Every item that can appear gets a number and a birth time. The page is redrawn whole, so animations restart on
// every redraw; a negative delay (an item's age, or the global phase for loops) makes them continue instead.
let S
function reset() {
  S = { t0: null, tLast: 0, seq: 0, born: [], challenges: new Map(), pairs: new Map(), loops: new Map(), ticks: [], log: [], stops: 0, focus: null, pinned: false, records: new Map(), faults: null, open: new Set(), edit: null }
  shownStats = {}
  dirty()
}
const FADE_MS = 400
function next() {
  S.born[++S.seq] = performance.now()
  return S.seq
}
function anim(item) {
  const age = performance.now() - (S.born[item.seq] ?? 0)
  return age < FADE_MS ? ` data-enter style="animation-delay:-${age.toFixed(0)}ms"` : ""
}
const phase = (ms, offset = 0) => `animation-delay:-${((performance.now() + offset) % ms).toFixed(0)}ms`
const spinner = () => `<i class="spin" style="${phase(900)}"></i>`

const challenge = (id) => {
  if (!S.challenges.has(id)) S.challenges.set(id, { id, owner: "", status: "submitted", steps: [], shortlist: [], cards: {}, picked: null, stopped: 0, fixed: 0, seq: next() })
  return S.challenges.get(id)
}
const pair = (pairId) => {
  if (!S.pairs.has(pairId)) S.pairs.set(pairId, { pairId, moves: [], verdicts: [], status: "negotiating" })
  return S.pairs.get(pairId)
}
const step = (challengeId, s) => challenge(challengeId).steps.push({ kind: "text", cls: "", ...s, seq: next() })
const focus = (pairId) => { if (!S.pinned) S.focus = pairId }
const GLYPH = { "prenup.match.proposed": "acc", "prenup.proposal.ready": "acc", "prenup.negotiation.agreed": "acc", "prenup.reservation.conflict": "ink", "prenup.arbiter.decided": "ink", "prenup.rematch": "ink", "prenup.pair.cancelled": "ink", "prenup.nomatch": "ink" }
const log = (e, text, cls = "") => S.log.push({ t: e.t, producer: e.producer, text, cls, glyph: cls === "crit" ? "crit" : GLYPH[e.type] ?? "", seq: next() })
const at = (t) => (t - S.t0) / 1000

function apply(e) {
  const t = Date.parse(e.t)
  S.t0 ??= t
  S.tLast = Math.max(S.tLast, t)
  e.t = t
  const p = e.payload
  if (e.type === "inference.started") return void S.loops.set(e.loopId, { group: group(e.producer), start: t, end: null })
  if (e.type === "inference.completed") return void (S.loops.get(e.loopId) && (S.loops.get(e.loopId).end = t))
  if (!e.type.startsWith("prenup.") || typeof p !== "object" || p === null) return
  const tick = (red = false) => group(e.producer) && S.ticks.push({ group: group(e.producer), t, red })

  switch (e.type) {
    case "prenup.challenge.submitted":
      challenge(p.challengeId).owner = e.producer
      log(e, `${p.challengeId} submitted`)
      break
    case "prenup.challenge.analyzed": {
      const c = challenge(p.challengeId)
      c.status = "searching"
      step(p.challengeId, { html: p.researchProblem ? `Analyst: a research problem. <span class="why">Searching for ${esc(p.searchTerms.slice(0, 4).join(", "))}…</span>` : `Analyst: not a research problem` })
      log(e, `${p.challengeId}: ${p.researchProblem ? "research problem" : "not a research problem"}`)
      tick()
      break
    }
    case "prenup.shortlist.ready": {
      const c = challenge(p.challengeId)
      c.shortlist = p.candidates.map((x) => x.researcherId)
      c.status = "profiling"
      log(e, `${p.challengeId}: BM25 shortlist ${c.shortlist.join(", ")}`)
      tick()
      break
    }
    case "prenup.profile.ready":
      challenge(p.challengeId).cards[p.researcherId] = p
      log(e, `${p.researcherId} card for ${p.challengeId}: fit ${p.fit}${p.flags.length ? `, flags: ${p.flags.map((f) => f.kind).join(", ")}` : ""}`)
      tick()
      break
    case "prenup.fit.done":
      for (const r of p.reviews) {
        const card = challenge(p.challengeId).cards[r.researcherId]
        if (card) card.fit = r.fit
      }
      log(e, `fit review for ${p.challengeId}: ${p.reviews.map((r) => `${r.researcherId} ${r.fit}`).join(", ") || "no change"}`)
      tick()
      break
    case "prenup.plan.reviewed":
      log(e, `plan review for ${p.pairId}: ${p.issues.length} problems sent back to the writer, ${p.unconfirmed.length} contributions to confirm`)
      break
    case "prenup.eval.planted":
      S.faults = { list: p.faults.map((f) => ({ ...f, seq: next() })), claims: {}, verdicts: {} }
      log(e, `planted ${p.faults.length} false claims, built by code from real records`)
      break
    case "prenup.critic.check":
      if (S.faults && p.pairId.startsWith("eval:")) for (const c of p.claims) S.faults.claims[c.id] = c
      break
    case "prenup.critic.verdict": {
      const stopped = p.verdict !== "pass"
      if (p.pairId.startsWith("eval:") && S.faults) {
        S.faults.verdicts[p.claimId] = { ...p, seq: next() }
        if (stopped) S.stops++
        log(e, `${p.claimId}: ${stopped ? `${p.verdict} (${p.check}) ${p.reason}` : "passed"}`, stopped ? "crit" : "")
        if (stopped) tick(true)
        break
      }
      if (stopped && p.attempt === 1) S.stops++ // first-pass stops, as the README counts them
      if (p.pairId.startsWith("profile:")) {
        const c = challenge(p.pairId.slice(8).split("__")[0])
        if (stopped && p.attempt === 1) c.stopped++
        if (!stopped && p.attempt === 2) c.fixed++
      } else pair(p.pairId).verdicts.push({ ...p, seq: next() })
      if (stopped || p.attempt === 2) log(e, `${p.claimId.replace(/^profile:/, "card ")}: ${stopped ? `${p.verdict} (${p.check}) ${p.reason}` : "passed after rewrite"}`, stopped ? "crit" : "")
      if (stopped) tick(true)
      break
    }
    case "prenup.match.proposed": {
      const c = challenge(p.challengeId)
      c.picked = p.researcherId
      c.status = "negotiating"
      for (const s of p.skipped ?? []) if (!c.steps.some((x) => x.skip === s.researcherId)) step(p.challengeId, { html: `Skipped ${idLink(s.researcherId)}: <span class="why">${linked(s.reason.split(": ")[0])}</span>`, skip: s.researcherId })
      step(p.challengeId, { html: `Reserved ${idLink(p.researcherId)} at board version ${p.reservationVersion}, fit ${esc(p.fit)}. Negotiation starts.`, cls: "key" })
      pair(p.pairId).challengeId = p.challengeId
      focus(p.pairId)
      log(e, `${p.challengeId} reserved ${p.researcherId} (version ${p.reservationVersion})`)
      tick()
      break
    }
    case "prenup.reservation.conflict":
      challenge(p.challengeId).status = "conflict"
      step(p.challengeId, { kind: "conflict", data: p })
      log(e, `conflict on ${p.researcherId}: ${p.challengeId} vs holder ${p.holder} (read v${p.seenVersion}, now v${p.version})`)
      tick()
      break
    case "prenup.arbiter.decided":
      for (const id of [p.winner, p.loser]) step(id, { kind: "arbiter", data: p })
      log(e, `${p.researcherId} -> ${p.winner}; ${p.loser} re-matches`)
      tick()
      break
    case "prenup.pair.cancelled":
      pair(p.pairId).status = "cancelled"
      pair(p.pairId).why = p.reason
      step(p.pairId.split("__")[0], { html: `Negotiation ${pairLabel(p.pairId)} stopped: <span class="why">${esc(p.reason)}</span>` })
      log(e, `${p.pairId} cancelled: ${p.reason}`)
      break
    case "prenup.rematch":
      challenge(p.challengeId).status = "re-matching"
      step(p.challengeId, { html: `${icon("rematch")} Re-matches by itself, away from ${idLink(p.from)}`, cls: "key" })
      log(e, `${p.challengeId} re-matches (away from ${p.from})`)
      tick()
      break
    case "prenup.negotiation.move":
      pair(p.pairId).moves.push({ ...p, seq: next() })
      focus(p.pairId)
      log(e, `${p.pairId} round ${p.round}, ${p.side}: ${p.action}${p.changes.length ? ` (changed ${p.changes.join(", ")})` : ""}`)
      break
    case "prenup.negotiation.agreed":
      Object.assign(pair(p.pairId), { status: "agreed", round: p.round })
      challenge(p.pairId.split("__")[0]).status = "writing"
      log(e, `${p.pairId}: agreed in round ${p.round}`)
      break
    case "prenup.negotiation.no_deal":
      Object.assign(pair(p.pairId), { status: "no deal", why: p.reason })
      log(e, `${p.pairId}: no deal (${p.reason})`)
      break
    case "prenup.writer.rewrote":
      pair(p.pairId).rewrote = p
      log(e, `${p.pairId}: ${p.sentBack.length} claims sent back to the writer, ${p.rewritten.length} rewritten`)
      break
    case "prenup.proposal.ready": {
      Object.assign(pair(p.pairId), { status: "proposal ready", ready: p })
      const c = challenge(p.pairId.split("__")[0])
      c.status = "proposal"
      step(c.id, { kind: "proposal", data: p, cls: "key" })
      focus(p.pairId)
      log(e, `proposal ready: ${p.pairId}`)
      break
    }
    case "prenup.nomatch": {
      challenge(p.challengeId).status = "no match"
      step(p.challengeId, { kind: "nomatch", data: p })
      log(e, `no match for ${p.challengeId}: ${p.verdict}`)
      tick()
      break
    }
    case "prenup.llm.failed":
    case "prenup.proposal.failed":
      log(e, `${e.type.slice(7)}: ${p.reason}`)
      break
  }
}

// --- rendering ---
let scheduled = false
function dirty() {
  if (scheduled) return
  scheduled = true
  requestAnimationFrame(() => {
    scheduled = false
    render()
  })
}

const TITLES = {
  demo: ["Matchmakers and Arbiter", "Each challenge, from search to outcome", "Negotiation and Critic", "The focused pair talking it out, and the claims the Critic checked"],
  plant: ["Critic test", "False claims planted on purpose, by kind", "Planted claims", "Each claim, its source, and the check that stopped it"],
}

function render() {
  const [hl, , hm] = TITLES[S.faults ? "plant" : "demo"]
  $("h-left").textContent = hl
  $("h-mid").textContent = hm
  $("follow").innerHTML = ""
  renderStats()
  if (S.faults) renderFaults()
  else {
    renderChallenges()
    renderPair()
  }
  renderLog()
  renderTimeline()
  // Keep redrawing while something is still fading in.
  if (performance.now() - (S.born[S.seq] ?? 0) < FADE_MS) dirty()
}

// Header numbers count toward their value instead of jumping.
let shownStats = {}
let statLayout = ""
let tweening = false
function renderStats() {
  const loops = [...S.loops.values()]
  let items = []
  if (S.faults) {
    const stopped = Object.values(S.faults.verdicts).filter((v) => v.verdict !== "pass")
    const bySupport = stopped.filter((v) => v.check === "support").length
    items = [["planted", S.faults.list.length, "planted"], ["stopped", stopped.length, "stopped", stopped.length ? "crit" : ""], ["code", stopped.length - bySupport, "code checks"], ["support", bySupport, "support check"]]
  } else if (S.t0) {
    const proposals = [...S.pairs.values()].filter((p) => p.ready).length
    items = [["calls", loops.length, "model calls"], ["proposals", proposals, proposals === 1 ? "proposal" : "proposals"], ["stops", S.stops, "claims stopped", S.stops ? "crit" : ""]]
  }
  const layout = items.map((i) => i[0] + i[2]).join()
  if (layout !== statLayout) {
    $("stats").innerHTML = items.map(([k, , label, , suffix]) => `<div class="stat" data-k="${k}" data-suffix="${suffix ?? ""}"><b>0${suffix ?? ""}</b><span>${label}</span></div>`).join("")
    statLayout = layout
  }
  for (const [k, value, , cls] of items) {
    const el = $("stats").querySelector(`[data-k="${k}"]`)
    el.dataset.target = value
    el.className = `stat ${cls ?? ""}`
  }
  if (!tweening) tween()
}
function tween() {
  tweening = false
  for (const el of $("stats").querySelectorAll("[data-target]")) {
    const target = Number(el.dataset.target)
    const now = shownStats[el.dataset.k] ?? 0
    const value = Math.abs(target - now) < 0.6 ? target : now + (target - now) * 0.22
    shownStats[el.dataset.k] = value
    el.querySelector("b").textContent = `${Math.round(value)}${el.dataset.suffix}`
    if (value !== target) tweening = true
  }
  if (tweening) requestAnimationFrame(tween)
}

const STATUS = {
  submitted: ["spin", "Submitted", ""], searching: ["spin", "Searching", ""], profiling: ["spin", "Profiling", ""],
  conflict: ["warn", "Conflict", "dark"], negotiating: ["spin", "Negotiating", "soft"], "re-matching": ["rematch", "Re-matching", ""],
  writing: ["spin", "Writing", "soft"], proposal: ["check", "Proposal", "solid"], "no match": ["x", "No match", ""],
  agreed: ["check", "Agreed", "soft"], "proposal ready": ["check", "Proposal ready", "solid"], cancelled: ["x", "Cancelled", "gone"], "no deal": ["x", "No deal", ""],
  "all stopped": ["shield", "All stopped", "crit"], checking: ["spin", "Checking", ""],
}
function pill(status) {
  const [ic, label, tone] = STATUS[status] ?? ["", status, ""]
  return `<span class="pill ${tone}">${ic === "spin" ? spinner() : ic ? icon(ic) : ""}${esc(label)}</span>`
}

function record(id) {
  if (!S.records.has(id)) {
    S.records.set(id, null)
    fetch(`/record/${id}`).then((r) => (r.ok ? r.json() : null)).then((rec) => { S.records.set(id, rec); dirty() }).catch(() => {})
  }
  return S.records.get(id)
}

function renderStep(s, c) {
  const a = anim(s)
  const d = s.data
  switch (s.kind) {
    case "conflict":
      return `<li class="co-li"${a}><div class="callout dark">${icon("warn")}<div><b>Conflict on ${idLink(d.researcherId)}</b><span class="why">Held by ${idLink(d.holder)}. Read version ${d.seenVersion}, the board is at ${d.version}: the write fails and goes to the Arbiter.</span></div></div></li>`
    case "arbiter": {
      const key = `arb-${c.id}-${s.seq}`
      const open = S.open.has(key)
      // What the citation check found in the reasoning before it was published (older traces have no check).
      const k = d.check
      const checked = k ? `<div class="arb-check">${icon("shield")}Reasoning checked: ${k.backed} of ${k.cited} citations backed by the cards${k.notBacked.length ? `; not backed: ${k.notBacked.map(esc).join(", ")}` : ""}${k.numbersNotInBrief.length ? `; numbers not in the cards: ${k.numbersNotInBrief.map(esc).join(", ")}` : ""}</div>` : ""
      return `<li class="co-li"${a}><div class="callout arb">${icon("scale")}<div><b>Arbiter: ${idLink(d.researcherId)} goes to ${idLink(d.winner)}</b><div class="reason ${open ? "open" : ""}">${linked(d.reason)}</div><button class="more" data-open="${key}">${open ? "Show less" : "Show the reasoning"}</button>${checked}</div></div></li>`
    }
    case "nomatch":
      return `<li class="co-li"${a}><div class="callout">${icon("x")}<div><b>No match: ${esc(d.verdict)}</b><span class="why">${linked(d.reason)}</span></div></div></li>`
    case "proposal":
      return `<li class="key"${a}><a class="cta" href="/proposal/${esc(d.pairId)}" target="_blank">${icon("doc")}Open the proposal</a><div class="why" style="margin-top:4px">${d.claims} claims checked; the Critic stopped ${d.stopped}, ${d.fixed} fixed on rewrite, ${d.dropped} dropped.</div></li>`
    default:
      return `<li class="${s.cls}"${a}>${s.html}</li>`
  }
}

function renderChallenges() {
  if (S.challenges.size === 0) return void ($("challenges").innerHTML = `<p class="empty">No run yet.</p>`)
  $("challenges").innerHTML = [...S.challenges.values()].map((c) => {
    const company = record(c.id.split("-")[0])
    const ask = record(c.id)
    const profiles = c.shortlist.length ? `<li>Profiler cards ${Object.keys(c.cards).length} of ${c.shortlist.length}${c.stopped ? `. <span class="why">The Critic stopped ${c.stopped} card claims; ${c.fixed} passed after a rewrite.</span>` : ""}</li>` : ""
    const [first, ...rest] = c.steps.map((s) => renderStep(s, c))
    return `<div class="card"${anim(c)}><div class="top"><div><div class="co">${esc(company?.name ?? c.id.split("-")[0])}</div><div class="meta">${idLink(c.id)}<span>·</span><span>${esc(c.owner)}</span></div></div>${pill(c.status)}</div>
      ${ask?.text ? `<p class="ask">${esc(ask.text)}</p>` : ""}
      <ul class="steps">${first ?? ""}${profiles}${rest.join("")}</ul></div>`
  }).join("")
}

function renderPair() {
  // Don't redraw under a reviewer who is typing or choosing in a term editor.
  const focused = document.activeElement
  if (focused?.matches?.("[data-draft]") && $("pair").contains(focused)) return
  const tabs = [...S.pairs.values()]
  if (tabs.length === 0) {
    return void ($("pair").innerHTML = `<div class="hero">${icon("arrows")}<h3>Watch an agreement form</h3><p>Press <b>Run the demo set</b>: eight company challenges are matched to researchers, contested, negotiated and fact-checked, live.</p></div>`)
  }
  const p = S.pairs.get(S.focus) ?? tabs.at(-1)
  const [challengeId, researcherId] = p.pairId.split("__")
  const company = record(challengeId.split("-")[0])
  const researcher = record(researcherId)
  const last = p.moves.at(-1)
  const sheet = last?.sheet
  const agreed = ["agreed", "proposal ready"].includes(p.status)
  const changed = new Set(agreed ? [] : last?.changes ?? [])
  const row = (key, label, value) => `<div class="row ${changed.has(key) ? "changed" : ""}"><span>${label}</span><span>${value}</span></div>`
  const list = (xs) => (xs.length ? xs.map(linked).join("; ") : `<span class="muted">none</span>`)

  const header = `<div class="tabs">${tabs.map((x) => `<button class="${x === p ? "on" : ""} ${x.status === "cancelled" ? "gone" : ""}" data-pair="${esc(x.pairId)}">${esc(x.pairId.replace("__", " × "))}</button>`).join("")}</div>`
  $("follow").innerHTML = S.pinned ? `<button data-follow>Follow live</button>` : "Following live"
  const parties = `<div class="card"><div class="top" style="margin-bottom:12px"><span class="meta">${pairLabel(p.pairId)}</span>${pill(p.status)}</div>
    <div class="parties">
      <div class="party"><span class="avatar">${icon("building")}</span><div class="txt"><b>${esc(company?.name ?? challengeId.split("-")[0])}</b><span>${company ? `${esc(company.sector)} · ${company.employees} employees` : ""}</span></div></div>
      <span class="vs">${icon("arrows")}</span>
      <div class="party right"><span class="avatar uni">${icon("cap")}</span><div class="txt"><b>${esc(researcher?.title ?? researcherId)}</b><span>${esc(researcher?.department ?? "")}</span></div></div>
    </div></div>`

  // The moves as a conversation: company on the left, researcher on the right; the side that moves next is typing.
  const bubbles = p.moves.map((m) => `<div class="msg ${m.side}"${anim(m)}><div class="who">${m.side === "company" ? "Company" : "Researcher"} · round ${m.round} · ${ACTION[m.action] ?? m.action}</div>
    <div class="bubble">${linked(m.reason)}${m.changes.length ? `<div class="changes">${m.changes.map((c) => `<span>${esc(FIELD[c] ?? c)}</span>`).join("")}</div>` : ""}</div></div>`).join("")
  const nextSide = !last ? "company" : last.side === "company" ? "researcher" : "company"
  const typing = p.status === "negotiating" ? `<div class="msg ${nextSide} typing"><div class="who">${nextSide === "company" ? "Company" : "Researcher"}</div><div class="bubble">${[0, 1, 2].map((i) => `<i style="${phase(1200, 1200 - i * 200)}"></i>`).join("")}</div></div>` : ""
  const system = agreed ? `<div class="system ok">${icon("check")}Agreed in round ${p.round ?? last?.round}</div>${p.ready ? "" : `<div class="system">${spinner()}The writer is drafting the proposal</div>`}`
    : p.status === "no deal" ? `<div class="system">${icon("x")}No deal: ${esc(p.why)}</div>`
    : p.status === "cancelled" ? `<div class="system">${icon("x")}Stopped: ${esc(p.why)}</div>` : ""
  const chat = `<div class="chat">${bubbles}${typing}${system}</div>`

  // Before approving, a reviewer may change five terms; the server checks each edit with the Critic's term checks.
  const review = decisions[p.pairId] ?? {}
  const edits = review.edits ?? {}
  const canEdit = !!p.ready && review.decision !== "approved"
  const val = (term, agreedValue) => (edits[term] ? edits[term].to : agreedValue)
  const show = {
    engagement: (v) => esc(ENGAGEMENT[v] ?? v),
    ip: (v) => esc(IP[v] ?? v),
    reviewDays: (v) => `${v}-day company review${sheet?.publication.companyMayRemoveConfidential ? "; the company may remove its confidential information, not results" : ""}`,
    exclusivityMonths: (v) => (Number(v) > 0 ? `${v} months in ${esc(sheet.exclusivity.field)}` : "none"),
    money: (v) => esc(v),
  }
  const OPTIONS = { engagement: Object.keys(ENGAGEMENT), ip: Object.keys(IP), reviewDays: [0, 30, 60, 90], exclusivityMonths: [0, 6, 12, 18, 24] }
  const editor = (term) => {
    const draft = S.edit.draft
    const field = term === "money"
      ? `<input data-draft value="${esc(draft)}" placeholder="to be agreed, or a funding route">`
      : `<select data-draft>${OPTIONS[term].map((o) => `<option value="${esc(o)}" ${String(o) === String(draft) ? "selected" : ""}>${term === "engagement" || term === "ip" ? show[term](o) : term === "reviewDays" ? `${o} days` : o > 0 ? `${o} months` : "none"}</option>`).join("")}</select>`
    return `<span class="editor">${field}<button class="save" data-edit-save>Save</button><button class="cancel" data-edit-cancel>Cancel</button>${S.edit.error ? `<span class="edit-error">${icon("shield")} Not allowed: ${esc(S.edit.error)}</span>` : ""}</span>`
  }
  const editable = (term, label, agreedValue) => {
    const open = S.edit?.pairId === p.pairId && S.edit.term === term
    const edit = edits[term]
    const body = open ? editor(term) : `${show[term](val(term, agreedValue))}${edit ? `<span class="was">Edited by you · agreed: ${show[term](edit.from)}</span>` : ""}`
    return `<div class="row ${edit ? "edited" : changed.has(term === "reviewDays" ? "publication" : term === "exclusivityMonths" ? "exclusivity" : term) ? "changed" : ""}"><span>${label}</span><span>${canEdit && !open ? `<button class="edit" data-edit="${term}" data-value="${esc(val(term, agreedValue))}">Edit</button>` : ""}${body}</span></div>`
  }
  const terms = sheet ? `<div class="label">${agreed ? `${icon("check")}Agreed up front` : `On the table · round ${last.round}`}</div><div class="group ${agreed ? "agreed" : ""}">
      ${editable("engagement", "Format", sheet.engagement)}
      ${editable("ip", "IP", sheet.ip)}
      ${editable("reviewDays", "Publication", sheet.publication.reviewDays)}
      ${editable("exclusivityMonths", "Exclusivity", sheet.exclusivity.months)}
      ${row("backgroundIp", "Background IP", list(sheet.backgroundIp))}
      ${row("contributions", "Contributions", `<b>Company</b> ${list(sheet.contributions.company)}<br><b>University</b> ${list(sheet.contributions.university)}`)}
      ${editable("money", "Money", sheet.money)}
      ${row("timeline", "Timeline", `${sheet.timeline.months} months${sheet.timeline.milestones.length ? `: ${list(sheet.timeline.milestones)}` : ""}`)}
    </div>` : ""

  // The Critic on this pair's proposal: what it stopped on the first pass, and what the rewrite did.
  const first = p.verdicts.filter((v) => v.attempt === 1 && v.verdict !== "pass")
  const passed = p.verdicts.filter((v) => v.attempt === 1 && v.verdict === "pass").length
  const second = new Map(p.verdicts.filter((v) => v.attempt === 2).map((v) => [v.claimId, v]))
  const rewritten = new Set(p.rewrote?.rewritten ?? [])
  const stops = first.map((v) => {
    const again = second.get(v.claimId)
    const then = !p.rewrote ? `<span class="then wait">${spinner()}Sent back to the writer</span>`
      : again?.verdict === "pass" ? `<span class="then fixed">${icon("check")}Rewritten by the writer, then passed</span>`
      : again ? `<span class="then dropped">${icon("x")}Rewritten, stopped again (${esc(again.check)}: ${linked(again.reason)}); dropped</span>`
      : rewritten.has(v.claimId) ? `<span class="then wait">${spinner()}Rewritten, checking</span>` : `<span class="then dropped">${icon("x")}Left out by the writer; dropped</span>`
    return `<div class="stop"${anim(v)}><span class="what">${icon("shield")}${esc(shortClaim(v.claimId))} · ${esc(v.check)}</span> ${linked(v.reason)}${v.suggestion ? `<br><span class="muted">Suggested: ${linked(v.suggestion)}</span>` : ""}${then}</div>`
  }).join("")
  const critic = p.verdicts.length ? `<div class="label">${icon("shield")}Critic on the proposal · ${p.verdicts.filter((v) => v.attempt === 1).length} claims, ${passed} passed first time</div>${stops}` : ""
  const decided = review.decision
  const nEdits = Object.keys(edits).length
  const gate = decided
    ? `<span class="pill ${decided === "approved" ? "solid" : "dark"}">${icon(decided === "approved" ? "check" : "x")}${decided === "approved" ? "Approved" : "Rejected"} by you${nEdits ? ` with ${nEdits} change${nEdits > 1 ? "s" : ""}` : ""}</span> <button class="linkish" data-decide="${esc(p.pairId)}" data-decision="">Change</button><p class="sub gate-note">Recorded. Sending isn't built, so nobody was contacted.</p>`
    : `<button class="secondary" data-decide="${esc(p.pairId)}" data-decision="approved">${icon("check")}Approve${nEdits ? ` with ${nEdits} change${nEdits > 1 ? "s" : ""}` : ""}</button> <button class="secondary" data-decide="${esc(p.pairId)}" data-decision="rejected">${icon("x")}Reject</button><p class="sub gate-note">A draft until a person approves it. You can edit the format, IP, publication, exclusivity and money first; each edit is checked like the agents' terms. Nobody is contacted before approval.</p>`
  const ready = p.ready ? `<div class="open-cta"><a class="cta" href="/proposal/${esc(p.pairId)}" target="_blank">${icon("doc")}Open the proposal</a></div><div class="gate">${gate}</div>` : ""

  $("pair").innerHTML = `${header}${parties}${chat}${ready}${terms}${critic}`
}

// The Critic test: what was planted, and which check stopped each claim. Same-name swaps first: the demo points at one.
const KINDS = ["same-name swap", "says more than its quote", "unavailable person", "engagement not in open_to", "invented money", "altered quote", "fake id"]
function renderFaults() {
  const F = S.faults
  const verdict = (f) => F.verdicts[f.claimId]
  const caught = (f) => verdict(f) && verdict(f).verdict !== "pass"
  const done = Object.keys(F.verdicts).length === F.list.length
  const n = F.list.filter(caught).length
  const kinds = KINDS.filter((k) => F.list.some((f) => f.kind === k))
  $("challenges").innerHTML = `<div class="card"><div class="top"><div><div class="co">Planted false claims</div><div class="meta">${icon("flask")}Built by code from real records</div></div>${pill(done ? (n === F.list.length ? "all stopped" : `${n} stopped`) : "checking")}</div>
      <div class="big" style="margin:16px 0 2px; color:${done ? "var(--red)" : "var(--ink)"}">${done ? n : "…"}<small> / ${F.list.length} stopped</small></div>
      <p class="why" style="margin:8px 0 0">Sent to the Critic as one check, the way a writer's draft is: code checks first, then one cheap-model support check for what passes them. Planted on purpose.</p></div>
    <div class="group kinds">${kinds.map((k) => {
      const mine = F.list.filter((f) => f.kind === k)
      const got = mine.filter(caught).length
      return `<div class="row"><span>${esc(k[0].toUpperCase() + k.slice(1))}</span><b class="${done && got ? "crit" : ""}">${done ? `${got} / ${mine.length}` : `… / ${mine.length}`}</b></div>`
    }).join("")}</div>`
  $("pair").innerHTML = kinds.map((k) => `<div class="label">${esc(k)}</div>${F.list.filter((f) => f.kind === k).map((f) => {
    const c = F.claims[f.claimId]
    const v = verdict(f)
    const src = c?.sources[0]
    const quote = src ? (src.quote.length > 90 ? `${src.quote.slice(0, 90)}…` : src.quote) : ""
    const result = !v ? `<div class="checking">${spinner()}Checking</div>`
      : v.verdict === "pass" ? `<div class="checking">Passed: not caught</div>`
      : `<div class="stop"><span class="what">${icon("shield")}Stopped · ${esc(v.check)}</span> ${linked(v.reason)}</div>`
    return `<div class="fault"${anim(f)}><div class="claim">${c ? linked(c.text) : esc(f.claimId)}</div>
      ${src ? `<div class="src">Cites ${src.id.startsWith("move:") ? "the term sheet" : idLink(src.id)} · ${esc(src.field)} · “${esc(quote)}”</div>` : ""}
      <div class="src">Planted: ${linked(f.planted)}</div>${result}</div>`
  }).join("")}`).join("")
}

function renderLog() {
  $("log").innerHTML = S.log.length ? S.log.slice(-300).reverse().map((l) =>
    `<div${anim(l)}><i class="g ${l.glyph ?? ""}"></i><span class="t">${l.t ? `${at(l.t).toFixed(1)}s` : ""}</span><span class="${l.cls === "crit" ? "crit-text" : l.cls}">${l.producer ? `<span class="p">${esc(l.producer)}</span>` : ""}${linked(l.text)}</span></div>`).join("") : `<p class="empty" style="margin:0;padding:16px">Events appear here as agents emit them.</p>`
}

function renderTimeline() {
  const svg = $("timeline")
  const width = svg.clientWidth || 800
  const height = svg.clientHeight || 160
  const label = 138
  const span = Math.max((S.tLast - (S.t0 ?? 0)) / 1000, 1)
  const x = (t) => label + ((t - S.t0) / 1000 / span) * (width - label - 6)
  const lanes = {}
  const bars = []
  for (const loop of [...S.loops.values()].filter((l) => l.group).sort((a, b) => a.start - b.start)) {
    const ends = (lanes[loop.group] ??= [])
    const end = loop.end ?? S.tLast
    let lane = ends.findIndex((e) => e <= loop.start)
    if (lane === -1) lane = ends.push(end) - 1
    else ends[lane] = end
    bars.push({ ...loop, end, lane, open: loop.end === null })
  }
  // Rows share the height; a row's lanes squeeze to fit.
  const top = 16
  const rowH = (height - top) / GROUPS.length
  const rows = Object.fromEntries(GROUPS.map((g, i) => [g, { y: top + i * rowH, n: Math.max((lanes[g] ?? []).length, 1) }]))
  const laneH = (g) => Math.min(5, (rowH - 6) / rows[g].n)
  const parts = []
  for (const g of GROUPS) parts.push(`<rect class="tl-band" x="${label}" y="${rows[g].y + 1}" width="${width - label - 6}" height="${rowH - 2}" rx="5"/>`)
  const tickStep = span > 120 ? 30 : span > 40 ? 10 : span > 12 ? 5 : 1
  for (let s = 0; s <= span; s += tickStep) parts.push(`<line class="tl-grid" x1="${x(S.t0 + s * 1000)}" x2="${x(S.t0 + s * 1000)}" y1="${top}" y2="${height}"/><text class="tl-sec" x="${x(S.t0 + s * 1000) + 3}" y="11">${s}s</text>`)
  for (const g of GROUPS) parts.push(`<text class="tl-name" x="0" y="${rows[g].y + rowH / 2 + (rowH < 18 ? 3.5 : 4)}"${rowH < 18 ? ' style="font-size:10.5px"' : ""}>${g}</text>`) // short screens: smaller names keep rows apart
  for (const b of bars) {
    const h = Math.max(laneH(b.group) - 1, 1.5)
    const y = rows[b.group].y + 3 + (b.lane % rows[b.group].n) * laneH(b.group)
    parts.push(`<rect x="${x(b.start).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(x(b.end) - x(b.start), 2).toFixed(1)}" height="${h.toFixed(1)}" rx="${(h / 2).toFixed(1)}" style="fill:var(--accent)"${b.open ? ` class="tl-open" style="${phase(1100)}"` : ""}/>`)
  }
  for (const t of S.ticks) if (rows[t.group]) parts.push(`<line class="${t.red ? "tl-crit" : "tl-tick"}" x1="${x(t.t)}" x2="${x(t.t)}" y1="${rows[t.group].y + 2}" y2="${rows[t.group].y + rowH - 2}"/>`)
  svg.innerHTML = S.t0 ? parts.join("") : ""
}

// --- wiring ---
let running = false
function buttons() {
  $("run").innerHTML = running ? `${spinner()}Running` : `${icon("play")}Run the demo set`
  $("plant").innerHTML = `${icon("flask")}Plant false claims`
  $("logbtn").innerHTML = icon("log")
  $("theme").innerHTML = icon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon")
}
function setTheme(theme) {
  document.documentElement.dataset.theme = theme
  try { localStorage.setItem("prenup-theme", theme) } catch { /* private window: the toggle still works for this page */ }
  buttons()
  dirty()
}
let decisions = {}
document.addEventListener("click", (ev) => {
  const gate = ev.target.closest("[data-decide]")
  if (gate) {
    if (gate.dataset.decision) fetch(`/decide/${gate.dataset.decide}?decision=${gate.dataset.decision}`, { method: "POST" })
    else if (decisions[gate.dataset.decide]) { delete decisions[gate.dataset.decide].decision; dirty() } // Change: the buttons again; the last decision stands until a new one
  }
  const edit = ev.target.closest("[data-edit]")
  if (edit) { S.edit = { pairId: S.focus ?? [...S.pairs.keys()].at(-1), term: edit.dataset.edit, draft: edit.dataset.value, error: "" }; dirty() }
  if (ev.target.closest("[data-edit-cancel]")) { S.edit = null; dirty() }
  if (ev.target.closest("[data-edit-save]") && S.edit) {
    const { pairId, term, draft } = S.edit
    fetch(`/amend/${pairId}?term=${encodeURIComponent(term)}&value=${encodeURIComponent(draft)}`, { method: "POST" }).then(async (r) => {
      if (r.ok) S.edit = null
      else S.edit = { ...S.edit, error: (await r.json().catch(() => ({ reason: "refused" }))).reason }
      document.activeElement?.blur?.()
      dirty()
    })
  }
  const tab = ev.target.closest("[data-pair]")
  if (tab) { S.focus = tab.dataset.pair; S.pinned = true; dirty() }
  if (ev.target.closest("[data-follow]")) { S.pinned = false; S.focus = [...S.pairs.keys()].at(-1); dirty() }
  const more = ev.target.closest("[data-open]")
  if (more) { S.open.has(more.dataset.open) ? S.open.delete(more.dataset.open) : S.open.add(more.dataset.open); dirty() }
})
// Keep what the reviewer picked or typed across redraws.
document.addEventListener("input", (ev) => { if (ev.target.matches?.("[data-draft]") && S.edit) S.edit.draft = ev.target.value })
document.addEventListener("change", (ev) => { if (ev.target.matches?.("[data-draft]") && S.edit) { S.edit.draft = ev.target.value; ev.target.blur(); dirty() } })
$("logbtn").addEventListener("click", () => {
  $("logcol").hidden = !$("logcol").hidden
  document.querySelector("main").classList.toggle("with-log", !$("logcol").hidden)
})
$("run").addEventListener("click", () => fetch("/run?speed=8", { method: "POST" }))
$("plant").addEventListener("click", () => fetch("/plant", { method: "POST" }))
$("theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"))
window.addEventListener("resize", dirty)

let saved = null
try { saved = localStorage.getItem("prenup-theme") } catch { /* no storage: light */ }
document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") ?? saved ?? "light"
reset()
buttons()
const source = new EventSource("/events")
source.addEventListener("decisions", (ev) => { decisions = JSON.parse(ev.data); dirty() })
source.addEventListener("reset", () => reset())
source.addEventListener("trace", (msg) => { try { apply(JSON.parse(msg.data)) } catch { /* a half-written line */ } dirty() })
// The run's console: only the outcome and failures; everything else is already on the board as events.
source.addEventListener("log", (msg) => {
  const line = JSON.parse(msg.data)
  if (/^(done|run finished|model call failed|model answer failed|proposal failed|timed out)/.test(line)) S.log.push({ t: 0, producer: "", text: `run: ${line}`, cls: "run", seq: next() })
  dirty()
})
source.addEventListener("status", (msg) => {
  const s = JSON.parse(msg.data)
  running = s.running
  $("run").disabled = $("plant").disabled = s.running
  buttons()
})
</script>
